<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload receipt</title>
    <style>
        body {
            background: #f4f6f8;
            color: #20242a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
        }
        main {
            margin: 0 auto;
            max-width: 32rem;
            padding: 2rem 1rem;
        }
        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
        }
        h1 { font-size: 1.5rem; margin-top: 0; }
        input[type="file"] { display: block; margin: 1rem 0; width: 100%; }
        button {
            background: #1769aa;
            border: 0;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            min-height: 3rem;
            padding: 0.75rem 1rem;
            width: 100%;
        }
        .success {
            background: #e8f5e9;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            padding: 1rem;
            overflow-wrap: anywhere;
        }
        .errorlist { color: #b00020; padding-left: 1.25rem; }
        .helptext { color: #5f6872; font-size: 0.9rem; }
    </style>
</head>
<body>
<main>
    <section class="card">
        <h1>Upload a receipt</h1>
        {% if receipt %}
            <div class="success" role="status">
                Receipt stored successfully.<br>
                Reference: {{ receipt.id }}
            </div>
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Store receipt</button>
        </form>
    </section>
</main>
</body>
</html>
